[project]
name = "sentinel"
version = "0.1.0"
description = "UTEKinetics invisible ergonomic sentinel: Systemic Fatigue Score service"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pynput>=1.8",
    "pywinctl>=0.4",
    "psutil>=6",
    "numpy",
    "opencv-python",
    # mediapipe 1.x has no Intel-Mac wheel; Intel Macs fall back to 0.10.21 (same Tasks API)
    "mediapipe>=1.2; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "mediapipe==0.10.21; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
