[project]
name = "sentinel"
version = "0.1.0"
description = "UTEKinetics invisible ergonomic sentinel: Systemic Fatigue Score service"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
# Core: main loop, scoring, intervention engine, HTTP/WebSocket API, JSON output.
# Everyone needs these. Sensor libraries are optional extras, see below.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psutil>=6",
]

[project.optional-dependencies]
# Keyboard + Mouse + Context sensors: uv sync --extra input
input = [
    "pynput>=1.8",
    "pywinctl>=0.4",
]
# Webcam sensor: uv sync --extra vision
# mediapipe 1.x ships no Intel-Mac (macOS x86_64) wheels, so the vision extra is skipped there;
# the backend then runs with vision.available = False.
vision = [
    "numpy; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "opencv-python; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "mediapipe>=1.2; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
